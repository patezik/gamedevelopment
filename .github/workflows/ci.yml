# CI. The nightly 20 000-seed sweep lives in nightly.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tasks:
    name: Tasks and index
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm run tasks:check
      - name: Task of the PR branch is claimed
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: node tools/tasks/tasks.mjs pr-check "$HEAD_REF"

  docs:
    name: Documentation links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm run docs:check

  # Path filtering lives in a job, not in on.*.paths: a skipped job still reports success,
  # so these checks can be required in branch protection.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      node: ${{ steps.filter.outputs.node }}
      godot: ${{ steps.filter.outputs.godot }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          NODE_PATHS: '^(packages/|apps/(server|mobile)/|apps/desktop/src/net/protocol_constants\.gd$|tools/|content/|\.github/workflows/|package(-lock)?\.json$|tsconfig[^/]*\.json$|eslint\.config\.mjs$|vitest\.config\.ts$|\.nvmrc$)'
          GODOT_PATHS: '^(apps/desktop/|apps/server/|packages/(protocol|core)/|content/scenarios/|tools/test-godot\.mjs$|\.github/workflows/ci\.yml$|package(-lock)?\.json$|\.nvmrc$)'
        run: |
          report_match() {
            if grep -qE "$2" <<< "$changed_paths"; then
              echo "$1=true" >> "$GITHUB_OUTPUT"
            else
              echo "$1=false" >> "$GITHUB_OUTPUT"
            fi
          }

          if [ -z "$BASE_SHA" ]; then
            echo "node=true" >> "$GITHUB_OUTPUT"
            if git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
              changed_paths=$(git diff --name-only "$PUSH_BEFORE" HEAD)
              report_match godot "$GODOT_PATHS"
            else
              echo "godot=true" >> "$GITHUB_OUTPUT"
            fi
          else
            changed_paths=$(git diff --name-only "$BASE_SHA"...HEAD)
            report_match node "$NODE_PATHS"
            report_match godot "$GODOT_PATHS"
          fi

  node:
    name: Lint, types and tests
    needs: changes
    if: needs.changes.outputs.node == 'true'
    runs-on: ubuntu-latest
    # The 1000-seed properties plus coverage exceeded 10 minutes on the expanded sanatorium.
    # Keep every test and its individual timeout; only allow the complete job to finish.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run content:check
      - run: npm test -- --coverage

  # QA-002: separate job so benchmarks run without coverage and do not lengthen the node job.
  perf:
    name: Performance budgets
    needs: changes
    if: needs.changes.outputs.node == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run bench
      - name: Verify that an intentional scheduler slowdown fails the budget
        if: success() || failure()
        shell: bash
        run: |
          set -euo pipefail
          benchmark=packages/core/test/performance/scheduler.ts
          trap 'git restore -- "$benchmark"' EXIT
          python3 - "$benchmark" <<'PY'
          import pathlib
          import sys

          benchmark = pathlib.Path(sys.argv[1])
          source = benchmark.read_text()
          marker = '  const elapsedMs ='
          assert source.count(marker) == 1
          delay = '  Atomics.wait(new Int32Array(new SharedArrayBuffer(4)), 0, 0, 210);\n'
          benchmark.write_text(source.replace(marker, delay + marker))
          PY
          if node "$benchmark" > scheduler-regression.log 2>&1; then
            cat scheduler-regression.log
            echo 'The scheduler budget accepted the injected slowdown'
            exit 1
          fi
          cat scheduler-regression.log
          grep -E 'AssertionError.*scheduler 100k events took .*budget 200 ms' scheduler-regression.log

  # VAL-008: seed sweep of the sanatorium. A separate job so it runs in parallel with `node`.
  # It fails on a regression against packages/validator/sweep-baseline.json, not on the absolute
  # MVP threshold (failures < 1 %): that one is not met yet (CNT-007), see testing-strategy.md.
  sweep:
    name: Seed sweep
    needs: changes
    if: needs.changes.outputs.node == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # --max-failure-rate 1 turns off the absolute failure threshold only; the baseline check
      # below is the gate. The exit code is still non-zero for a crash or a bad argument.
      - name: Sweep 1000 seeds
        run: >
          npm run sweep -- --scenario sanatorium_winter --count 1000 --from 0 --workers 4
          --out reports --max-failure-rate 1
      - name: Compare with the baseline
        run: >
          npm run sweep:check -- --report reports/sweep-sanatorium_winter-0-1000.json
          --summary "$GITHUB_STEP_SUMMARY"
      - name: Upload the sweep reports
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: sweep-reports
          path: reports/
          if-no-files-found: error

  godot:
    name: Godot tests
    needs: changes
    if: needs.changes.outputs.godot == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      GODOT_VERSION: 4.7.2-stable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # The live accusation tests run the real session server (tsx, fastify, ws).
      - run: npm ci
      - uses: actions/cache@v6
        id: cache-godot
        with:
          path: ${{ runner.temp }}/godot
          key: godot-${{ runner.os }}-x86_64-${{ env.GODOT_VERSION }}
      - name: Install Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          archive="Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          cd "$RUNNER_TEMP"
          curl --fail --location --silent --show-error --retry 3 \
            --output "$archive" \
            "https://github.com/godotengine/godot-builds/releases/download/$GODOT_VERSION/$archive"
          printf '%s  %s\n' \
            '9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65' \
            "$archive" | sha512sum --check
          unzip -q "$archive" -d godot
          chmod +x "godot/${archive%.zip}"
      - name: Run headless tests
        run: GODOT_BIN="$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}_linux.x86_64" npm run test:godot
